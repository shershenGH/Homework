<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Обратная связь</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<form>
				<fieldset>
					<label>
						<h2>Ваши личные данные</h2>
					</label>
					<label class="contact">
						<span>Ваше имя</span>
						<input type="text" placeholder="Имя" required />
					</label>

					<label class="contact">
						<span>Ваш возраст</span>
						<input type="number" placeholder="Возраст" required />
					</label>

					<label class="contact">
						<span>Ваш телефон</span>
						<input type="tel" placeholder="+7 " required />
					</label>

					<label class="contact">
						<span>Ваша почта</span>
						<input type="email" placeholder="Почта" required />
					</label>

					<label class="contact">
						<span>Сообщение</span>
						<textarea
							placeholder="Введите сообщение"
							name="message"
							id="message"
							minlength="5"
							maxlength="350"
						>
						</textarea>
					</label>

					<label class="rules">
						<input class="checkbox" type="checkbox" />
						<span>Я принимаю правила</span>
					</label>

					<label class="button">
						<button>Отправить</button>
					</label>
				</fieldset>
			</form>
		</main>
	</body>
</html>
